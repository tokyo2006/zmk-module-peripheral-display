# NOTE: this workflow runs ONLY native_posix unit tests. It CANNOT build the
# full shield firmware standalone: a shield build requires a keyboard shield
# config plus an external board repo (e.g. a741725193/zmk-board-eyelash),
# which this module does not depend on. Full-firmware build validation is
# therefore delegated to downstream user keyboard repositories via their own
# GitHub Actions (per the spec §10.1). Do not add a firmware build job here.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test: [pack_unpack, shadow_state, debounce, forward_trigger]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: West init
        uses: zmkfirmware/zmk-action@v1
        with:
          west-args: >-
            --extra-modules
            $GITHUB_WORKSPACE
      - name: Build ${{ matrix.test }}
        run: |
          west build -b native_posix -p auto \
            tests/${{ matrix.test }}
      - name: Run ${{ matrix.test }}
        run: |
          west build -b native_posix -t run \
            tests/${{ matrix.test }}
