# Module-level defaults. Override in user's prj.conf if needed.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_PERIPHERAL_DISPLAY=y
CONFIG_ZMK_PERIPHERAL_STATUS_RECEIVE=y
CONFIG_ZMK_PERIPHERAL_DISPLAY_WIDGETS=y
CONFIG_ZMK_PERIPHERAL_DISPLAY_WIDGET_WPM=y
CONFIG_ZMK_PERIPHERAL_DISPLAY_WIDGET_BONGO_CAT=y

# LVGL
CONFIG_LV_Z_VDB_SIZE=100

# Dedicated display work queue thread (enabled by the keyboard shield).
# Default is 3072; nice_view uses 4096. The peripheral display has more
# widgets + a bongo-cat lv_animimg animation, so give the render thread
# more headroom to avoid stack overflow while drawing.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
